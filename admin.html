<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ניהול · RE:PLAY</title>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    body{min-height:100vh;background:#120018;font-family:Assistant,sans-serif;color:#fff;display:flex;justify-content:center;padding:16px}
    .wrap{width:100%;max-width:440px;background:#1a0024;border-radius:24px;padding:16px}
    h1{text-align:center;color:#ff2d8f}
    a,button{display:block;width:100%;text-align:center;text-decoration:none;border:0;border-radius:12px;padding:14px;font:800 15px Assistant,sans-serif;margin:10px 0}
    .pink{background:#ff2d8f;color:#120018}
    .gold{background:#f3c14b;color:#1a1200}
    input{width:100%;padding:12px;border-radius:12px;border:0;font:16px Assistant,sans-serif;margin:10px 0}
    #gate,#app{display:none}
    #gate.on,#app.on{display:block}
    #err{text-align:center;color:#ff8aa8;min-height:20px}
  </style>
</head>
<body>
<div class="wrap" id="gate">
  <h1>ניהול</h1>
  <input id="pw" type="password" placeholder="סיסמה" />
  <button class="pink" id="go" type="button">כניסה</button>
  <p id="err"></p>
</div>
<div class="wrap" id="app">
  <h1>ניהול RE:PLAY</h1>
  <a class="pink" href="album.html?admin=1">אלבום — צפייה ומחיקה</a>
  <a class="gold" href="reviews.html">חוות דעת — סטטיסטיקה ומחיקה</a>
  <a href="./" style="color:#c9a8ff">חזרה לאתר</a>
</div>
<script>
const PASS='Drtech80';
const gate=document.getElementById('gate'), app=document.getElementById('app');
function openApp(){ gate.classList.remove('on'); app.classList.add('on'); }
if(sessionStorage.getItem('replay-admin')==='1') openApp();
else gate.classList.add('on');
document.getElementById('go').onclick=()=>{
  if(document.getElementById('pw').value===PASS){ sessionStorage.setItem('replay-admin','1'); openApp(); }
  else document.getElementById('err').textContent='סיסמה שגויה';
};
document.getElementById('pw').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('go').click(); });
</script>
</body></html>
