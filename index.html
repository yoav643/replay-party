<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#120018" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RE:PLAY" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="https://i.imgur.com/kApDN84.jpeg" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <title>RE:PLAY · היום זה קורה</title>
  <meta property="og:title" content="RE:PLAY · היום זה קורה" />
  <meta property="og:description" content="10.9 · 21:00-02:00 · ניקה · Music by Guy Pilo" />
  <meta property="og:image" content="https://i.imgur.com/kApDN84.jpeg" />
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700;800&family=Oswald:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;height:100dvh;overflow:hidden;background:#07000b;font-family:Assistant,Arial,sans-serif;color:#fff}
    body{display:flex;justify-content:center;align-items:stretch;padding:8px}
    .phone{position:relative;width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;background:#14001c;border-radius:22px;overflow:hidden;box-shadow:0 0 0 4px #1a0024,0 0 40px rgba(255,45,143,.25)}
    .fx{pointer-events:none;position:absolute;inset:0;z-index:2;overflow:hidden}
    .blob{position:absolute;border-radius:50%;filter:blur(28px);opacity:.45;animation:float 7s ease-in-out infinite}
    .blob.a{width:180px;height:180px;background:#ff2d8f;top:-40px;right:-30px}
    .blob.b{width:140px;height:140px;background:#3de0ff;bottom:80px;left:-40px;animation-delay:-2s}
    .blob.c{width:90px;height:90px;background:#f3c14b;top:40%;left:40%;animation-delay:-4s;opacity:.25}
    .spark{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 8px #ffd6ef;animation:rise 4.8s linear infinite}
    .glitter{position:absolute;width:10px;height:10px;background:#fff;clip-path:polygon(50% 0,61% 35%,100% 50%,61% 65%,50% 100%,39% 65%,0 50%,39% 35%);animation:twinkle 1.8s ease-in-out infinite;filter:drop-shadow(0 0 6px currentColor)}
    .dust{position:absolute;width:3px;height:3px;border-radius:50%;animation:drift 6s linear infinite}
    .scan{position:absolute;left:0;right:0;height:70px;background:linear-gradient(180deg,transparent,rgba(255,45,143,.16),transparent);animation:scan 5.5s linear infinite}
    .flyer-wrap{position:relative;z-index:1;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;background:#000}
    .flyer{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block;animation:glow 3.2s ease-in-out infinite}
    .bar{position:relative;z-index:3;flex:0 0 auto;padding:8px 12px 12px;background:linear-gradient(180deg,transparent,#14001c 18%)}
    .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
    .cd{display:flex;gap:6px;direction:ltr}
    .cd div{min-width:44px;background:rgba(255,255,255,.08);border-radius:10px;padding:4px 5px;text-align:center;animation:pulse 1.8s ease-in-out infinite}
    .cd b{display:block;font-family:Oswald,sans-serif;font-size:17px;line-height:1.1}
    .cd span{font-size:9px;color:#c9a8ff}
    .venue{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:#e8d7ff}
    .venue small{display:block;font-weight:700;color:#c9a8ff;font-size:10px}
    .icon{width:36px;height:36px;border-radius:50%;flex-shrink:0;border:0;padding:0;cursor:pointer}
    .waze{background:#33CCFF;animation:waze 1.6s ease-in-out infinite;display:block}
    .icon svg{width:36px;height:36px;display:block}
    .music{background:#ff2d8f;color:#fff}
    .music.on{background:#3de0ff;animation:waze 1s ease-in-out infinite}
    .music.wait{box-shadow:0 0 0 0 rgba(255,45,143,.7);animation:ring 1.2s ease-out infinite}
    .install{background:#f3c14b}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .actions a{position:relative;overflow:hidden;text-decoration:none;text-align:center;border-radius:14px;padding:11px 6px;font-weight:800;font-size:14px}
    .actions a.full{grid-column:1/-1}
    .actions a::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35),transparent 70%);transform:translateX(-120%);animation:shine 3.4s ease-in-out infinite}
    .pink{background:linear-gradient(90deg,#ff2d8f,#ff6bb5);color:#1a0018}
    .cyan{background:linear-gradient(90deg,#3de0ff,#7af);color:#041018}
    .gold{background:linear-gradient(90deg,#f3c14b,#ffe08a);color:#1a1200;animation:pop 2.8s ease-in-out infinite}
    .toast{display:none;position:absolute;left:12px;right:12px;bottom:118px;z-index:5;background:#2a0636;color:#fff;border-radius:14px;padding:12px 14px;font-size:14px;font-weight:700;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
    .toast.on{display:block}
    @keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(18px,-16px) scale(1.12)}}
    @keyframes rise{0%{transform:translateY(110%) scale(.6);opacity:0}18%{opacity:1}100%{transform:translateY(-130%) scale(1.1);opacity:0}}
    @keyframes twinkle{0%,100%{transform:scale(.2) rotate(0deg);opacity:.15}45%{transform:scale(1.15) rotate(20deg);opacity:1}70%{transform:scale(.55) rotate(-8deg);opacity:.5}}
    @keyframes drift{0%{transform:translate3d(0,20px,0) rotate(0);opacity:0}12%{opacity:.9}100%{transform:translate3d(18px,-120vh,0) rotate(180deg);opacity:0}}
    @keyframes scan{0%{top:-80px}100%{top:110%}}
    @keyframes glow{0%,100%{filter:drop-shadow(0 0 0 rgba(255,45,143,0))}50%{filter:drop-shadow(0 0 18px rgba(255,45,143,.55))}}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 rgba(255,45,143,0)}50%{box-shadow:0 0 12px rgba(255,45,143,.35)}}
    @keyframes waze{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
    @keyframes shine{0%,55%{transform:translateX(-120%)}80%,100%{transform:translateX(120%)}}
    @keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
    @keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,45,143,.55)}100%{box-shadow:0 0 0 14px rgba(255,45,143,0)}}
    @media (prefers-reduced-motion:reduce){.blob,.spark,.glitter,.dust,.scan,.flyer,.cd div,.waze,.music,.actions a::after,.gold{animation:none}}
  </style>
</head>
<body>
<div class="phone">
  <div class="fx" id="fx">
    <div class="blob a"></div>
    <div class="blob b"></div>
    <div class="blob c"></div>
    <div class="scan"></div>
  </div>
  <div class="flyer-wrap">
    <img class="flyer" src="https://i.imgur.com/kApDN84.jpeg" alt="RE:PLAY פלאייר" />
  </div>
  <div class="toast" id="toast"></div>
  <div class="bar">
    <div class="row">
      <div class="cd" id="cd">
        <div><b>--</b><span>שעות</span></div>
        <div><b>--</b><span>דקות</span></div>
        <div><b>--</b><span>שניות</span></div>
      </div>
      <div class="venue">
        <div>ניקה<small>הדסה 20</small></div>
        <button class="icon install" id="installBtn" type="button" aria-label="התקן אפליקציה" title="התקן אפליקציה">
          <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="#f3c14b"/><path fill="#1a1200" d="M24 13v14m0 0l-6-6m6 6l6-6M15 33h18" stroke="#1a1200" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon music wait" id="musicBtn" type="button" aria-label="מוזיקה" title="מוזיקה שנות ה-80">
          <svg viewBox="0 0 48 48" id="musicIcon"><circle cx="24" cy="24" r="24" fill="currentColor"/><path id="musicGlyph" fill="#1a0018" d="M30 14v16.2a4.2 4.2 0 1 1-2.4-3.8V18.2l-10 2.2v12.3a4.2 4.2 0 1 1-2.4-3.8V17.6z"/></svg>
        </button>
        <a class="icon waze" href="https://www.waze.com/ul?q=%D7%A0%D7%99%D7%A7%D7%94%20%D7%94%D7%93%D7%A1%D7%94%2020%20%D7%91%D7%90%D7%A8%20%D7%A9%D7%91%D7%A2&navigate=yes" target="_blank" rel="noopener" aria-label="Waze">
          <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="#33CCFF"/><path fill="#0B1D2A" d="M24 10c-6.6 0-12 5.1-12 12.2 0 8.3 10.2 15.3 11.6 16.2.4.3.9.3 1.3 0C26.3 37.5 36 30.5 36 22.2 36 15.1 30.6 10 24 10zm0 16.4a4.4 4.4 0 1 1 0-8.8 4.4 4.4 0 0 1 0 8.8z"/></svg>
        </a>
      </div>
    </div>
    <div class="actions">
      <a class="pink" href="photos.html">צלמו לאלבום</a>
      <a class="cyan" href="album.html">האלבום</a>
      <a class="gold full" href="review.html">ספרו לנו מה חשבתם</a>
    </div>
  </div>
</div>
<audio id="bgm" loop preload="auto">
  <source src="https://www.orangefreesounds.com/wp-content/uploads/2019/05/Friday-night-synthwave-electronic-music.mp3" type="audio/mpeg" />
  <source src="https://orangefreesounds.com/wp-content/uploads/2025/08/80s-synth-pop-disco-music-loop.mp3" type="audio/mpeg" />
</audio>
<script>
const fx=document.getElementById('fx');
const colors=['#fff','#ffe08a','#ff6bb5','#3de0ff','#ffffff'];
for(let i=0;i<18;i++){
  const s=document.createElement('div');
  s.className='spark';
  const c=colors[i%colors.length];
  s.style.left=(4+Math.random()*92)+'%';
  s.style.bottom=(-8-Math.random()*30)+'px';
  s.style.background=c;
  s.style.boxShadow='0 0 10px '+c;
  s.style.animationDelay=(-Math.random()*5)+'s';
  s.style.animationDuration=(3.2+Math.random()*3)+'s';
  fx.appendChild(s);
}
for(let i=0;i<28;i++){
  const g=document.createElement('div');
  g.className='glitter';
  const c=colors[i%colors.length];
  const size=6+Math.random()*10;
  g.style.width=size+'px';
  g.style.height=size+'px';
  g.style.left=(3+Math.random()*94)+'%';
  g.style.top=(4+Math.random()*70)+'%';
  g.style.background=c;
  g.style.color=c;
  g.style.animationDelay=(-Math.random()*2)+'s';
  g.style.animationDuration=(1.2+Math.random()*1.8)+'s';
  fx.appendChild(g);
}
for(let i=0;i<22;i++){
  const d=document.createElement('div');
  d.className='dust';
  const c=colors[i%colors.length];
  d.style.left=(Math.random()*100)+'%';
  d.style.bottom=(Math.random()*30)+'px';
  d.style.background=c;
  d.style.boxShadow='0 0 6px '+c;
  d.style.animationDelay=(-Math.random()*6)+'s';
  d.style.animationDuration=(4.5+Math.random()*4)+'s';
  fx.appendChild(d);
}
const end=new Date('2026-09-10T21:00:00+03:00').getTime();
function tick(){
  let s=Math.max(0,Math.floor((end-Date.now())/1000));
  const h=Math.floor(s/3600); s%=3600; const m=Math.floor(s/60); s%=60;
  const p=n=>String(n).padStart(2,'0');
  document.getElementById('cd').innerHTML='<div><b>'+p(h)+'</b><span>שעות</span></div><div><b>'+p(m)+'</b><span>דקות</span></div><div><b>'+p(s)+'</b><span>שניות</span></div>';
}
tick(); setInterval(tick,1000);

const audio=document.getElementById('bgm');
const btn=document.getElementById('musicBtn');
const glyph=document.getElementById('musicGlyph');
audio.volume=0.42;
const NOTE='M30 14v16.2a4.2 4.2 0 1 1-2.4-3.8V18.2l-10 2.2v12.3a4.2 4.2 0 1 1-2.4-3.8V17.6z';
const MUTE='M16.5 20.2v7.6h5.1L28 34V14l-6.4 6.2zM31.2 24l3.2-3.2 1.6 1.6L32.8 24l3.2 3.2-1.6 1.6-3.2-3.2-3.2 3.2-1.6-1.6 3.2-3.2-3.2-3.2 1.6-1.6z';
function setUi(on){
  btn.classList.toggle('on', on);
  btn.classList.toggle('wait', !on);
  glyph.setAttribute('d', on?NOTE:MUTE);
}
async function play(){
  try{ await audio.play(); localStorage.setItem('replay-music','1'); setUi(true); }
  catch(e){ setUi(false); }
}
function pause(){
  audio.pause();
  localStorage.setItem('replay-music','0');
  setUi(false);
}
btn.onclick=()=>{ if(audio.paused) play(); else pause(); };
if(localStorage.getItem('replay-music')!=='0') play();

if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
const toast=document.getElementById('toast');
function showToast(msg){
  toast.textContent=msg;
  toast.classList.add('on');
  setTimeout(()=>toast.classList.remove('on'),5000);
}
let deferred=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  deferred=e;
});
document.getElementById('installBtn').onclick=async()=>{
  if(window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone){
    showToast('האפליקציה כבר מותקנת');
    return;
  }
  if(deferred){
    deferred.prompt();
    const res=await deferred.userChoice;
    deferred=null;
    if(res.outcome==='accepted') showToast('האפליקציה הותקנה');
    return;
  }
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(ios) showToast('באייפון: שיתוף → הוסף למסך הבית');
  else showToast('בדפדפן: תפריט → התקן אפליקציה / הוסף למסך הבית');
};
</script>
</body></html>
