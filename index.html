<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#120018" />
  <title>RE:PLAY · היום זה קורה</title>
  <meta property="og:title" content="RE:PLAY · היום זה קורה" />
  <meta property="og:description" content="10.9 · 21:00-02:00 · ניקה · Music by Guy Pilo" />
  <meta property="og:image" content="https://i.imgur.com/kApDN84.jpeg" />
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700;800&family=Oswald:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;height:100dvh;overflow:hidden;background:#07000b;font-family:Assistant,Arial,sans-serif;color:#fff}
    body{display:flex;justify-content:center;align-items:stretch;padding:8px}
    .phone{position:relative;width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;background:#14001c;border-radius:22px;overflow:hidden;box-shadow:0 0 0 4px #1a0024,0 0 40px rgba(255,45,143,.25)}
    .fx{pointer-events:none;position:absolute;inset:0;z-index:2;overflow:hidden}
    .blob{position:absolute;border-radius:50%;filter:blur(28px);opacity:.45;animation:float 7s ease-in-out infinite}
    .blob.a{width:180px;height:180px;background:#ff2d8f;top:-40px;right:-30px;animation-delay:0s}
    .blob.b{width:140px;height:140px;background:#3de0ff;bottom:80px;left:-40px;animation-delay:-2s}
    .blob.c{width:90px;height:90px;background:#f3c14b;top:40%;left:40%;animation-delay:-4s;opacity:.25}
    .spark{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 8px #ff6bb5;animation:rise 4.8s linear infinite}
    .scan{position:absolute;left:0;right:0;height:70px;background:linear-gradient(180deg,transparent,rgba(255,45,143,.16),transparent);animation:scan 5.5s linear infinite}
    .flyer-wrap{position:relative;z-index:1;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;background:#000}
    .flyer{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block;animation:glow 3.2s ease-in-out infinite}
    .bar{position:relative;z-index:3;flex:0 0 auto;padding:8px 12px 12px;background:linear-gradient(180deg,transparent,#14001c 18%)}
    .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
    .cd{display:flex;gap:6px;direction:ltr}
    .cd div{min-width:48px;background:rgba(255,255,255,.08);border-radius:10px;padding:4px 6px;text-align:center;animation:pulse 1.8s ease-in-out infinite}
    .cd b{display:block;font-family:Oswald,sans-serif;font-size:18px;line-height:1.1}
    .cd span{font-size:10px;color:#c9a8ff}
    .venue{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:#e8d7ff}
    .venue small{display:block;font-weight:700;color:#c9a8ff;font-size:11px}
    .waze{width:40px;height:40px;border-radius:50%;flex-shrink:0;background:#33CCFF;animation:waze 1.6s ease-in-out infinite}
    .waze svg{width:40px;height:40px;display:block}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .actions a{position:relative;overflow:hidden;text-decoration:none;text-align:center;border-radius:14px;padding:11px 6px;font-weight:800;font-size:14px}
    .actions a.full{grid-column:1/-1}
    .actions a::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35),transparent 70%);transform:translateX(-120%);animation:shine 3.4s ease-in-out infinite}
    .pink{background:linear-gradient(90deg,#ff2d8f,#ff6bb5);color:#1a0018}
    .cyan{background:linear-gradient(90deg,#3de0ff,#7af);color:#041018}
    .gold{background:linear-gradient(90deg,#f3c14b,#ffe08a);color:#1a1200}
    .gold{animation:pop 2.8s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(18px,-16px) scale(1.12)}}
    @keyframes rise{0%{transform:translateY(110%);opacity:0}15%{opacity:1}100%{transform:translateY(-120%);opacity:0}}
    @keyframes scan{0%{top:-80px}100%{top:110%}}
    @keyframes glow{0%,100%{filter:drop-shadow(0 0 0 rgba(255,45,143,0))}50%{filter:drop-shadow(0 0 18px rgba(255,45,143,.55))}}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 rgba(255,45,143,0)}50%{box-shadow:0 0 12px rgba(255,45,143,.35)}}
    @keyframes waze{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
    @keyframes shine{0%,55%{transform:translateX(-120%)}80%,100%{transform:translateX(120%)}}
    @keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
    @media (prefers-reduced-motion:reduce){.blob,.spark,.scan,.flyer,.cd div,.waze,.actions a::after,.gold{animation:none}}
  </style>
</head>
<body>
<div class="phone">
  <div class="fx" id="fx">
    <div class="blob a"></div>
    <div class="blob b"></div>
    <div class="blob c"></div>
    <div class="scan"></div>
  </div>
  <div class="flyer-wrap">
    <img class="flyer" src="https://i.imgur.com/kApDN84.jpeg" alt="RE:PLAY פלאייר" />
  </div>
  <div class="bar">
    <div class="row">
      <div class="cd" id="cd">
        <div><b>--</b><span>שעות</span></div>
        <div><b>--</b><span>דקות</span></div>
        <div><b>--</b><span>שניות</span></div>
      </div>
      <div class="venue">
        <div>ניקה<small>הדסה 20</small></div>
        <a class="waze" href="https://www.waze.com/ul?q=%D7%A0%D7%99%D7%A7%D7%94%20%D7%94%D7%93%D7%A1%D7%94%2020%20%D7%91%D7%90%D7%A8%20%D7%A9%D7%91%D7%A2&navigate=yes" target="_blank" rel="noopener" aria-label="Waze">
          <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="#33CCFF"/><path fill="#0B1D2A" d="M24 10c-6.6 0-12 5.1-12 12.2 0 8.3 10.2 15.3 11.6 16.2.4.3.9.3 1.3 0C26.3 37.5 36 30.5 36 22.2 36 15.1 30.6 10 24 10zm0 16.4a4.4 4.4 0 1 1 0-8.8 4.4 4.4 0 0 1 0 8.8z"/></svg>
        </a>
      </div>
    </div>
    <div class="actions">
      <a class="pink" href="photos.html">צלמו לאלבום</a>
      <a class="cyan" href="album.html">האלבום</a>
      <a class="gold full" href="review.html">ספרו לנו מה חשבתם</a>
    </div>
  </div>
</div>
<script>
const fx=document.getElementById('fx');
for(let i=0;i<14;i++){
  const s=document.createElement('div');
  s.className='spark';
  s.style.left=(6+Math.random()*88)+'%';
  s.style.bottom=(-10-Math.random()*20)+'px';
  s.style.animationDelay=(-Math.random()*5)+'s';
  s.style.animationDuration=(3.6+Math.random()*2.8)+'s';
  s.style.opacity=String(.35+Math.random()*.5);
  fx.appendChild(s);
}
const end=new Date('2026-09-10T21:00:00+03:00').getTime();
function tick(){
  let s=Math.max(0,Math.floor((end-Date.now())/1000));
  const h=Math.floor(s/3600); s%=3600; const m=Math.floor(s/60); s%=60;
  const p=n=>String(n).padStart(2,'0');
  document.getElementById('cd').innerHTML='<div><b>'+p(h)+'</b><span>שעות</span></div><div><b>'+p(m)+'</b><span>דקות</span></div><div><b>'+p(s)+'</b><span>שניות</span></div>';
}
tick(); setInterval(tick,1000);
</script>
</body></html>
